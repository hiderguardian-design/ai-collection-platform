<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小集AI • AI作品集合</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans SC', sans-serif; background: #fafafa; }
    .category-tab { transition: all 0.3; }
    .category-tab.active { border-bottom: 3px solid #a855f7; color: #a855f7; font-weight: 500; }
    .work-card:hover { box-shadow: 0 12px 32px rgba(0,0,0,.08); transform: translateY(-2px); }
    .work-card { transition: all .25s; }
  </style>
</head>
<body class="min-h-screen">
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold text-purple-600">小集<span class="text-zinc-800">AI</span></h1>
        <p class="text-xs text-zinc-500 -mt-1">AI作品集合</p>
      </div>
      <nav class="hidden md:flex items-center gap-6 text-sm text-zinc-600">
        <a href="#" onclick="switchCategory('all')" class="category-tab active flex items-center gap-3 px-5 py-4 rounded-3xl text-lg">推荐</a>
        <a href="#" onclick="switchCategory('image')" class="category-tab flex items-center gap-3 px-5 py-4 rounded-3xl text-lg">图像</a>
        <a href="#" onclick="switchCategory('video')" class="category-tab flex items-center gap-3 px-5 py-4 rounded-3xl text-lg">视频</a>
        <a href="#" onclick="switchCategory('music')" class="category-tab flex items-center gap-3 px-5 py-4 rounded-3xl text-lg">音乐</a>
        <a href="#" onclick="switchCategory('novel')" class="category-tab flex items-center gap-3 px-5 py-4 rounded-3xl text-lg">小说</a>
      </nav>
      <div class="flex items-center gap-3">
        <div class="relative hidden sm:block">
          <input id="search" type="text" placeholder="搜索作品..." class="bg-zinc-100 rounded-full pl-9 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-300 w-40" oninput="filterGallery()">
          <i class="fa fa-search absolute left-3 top-3 text-zinc-400 text-sm"></i>
        </div>
        <button class="bg-purple-600 hover:bg-purple-700 text-white text-sm font-medium px-4 py-2 rounded-full flex items-center gap-2" onclick="showUploadModal()">
          <i class="fa fa-plus"></i><span class="hidden sm:inline">上传作品</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <div class="mb-8">
      <h2 class="text-2xl font-semibold mb-1">发现 AI 创作的现场</h2>
      <p class="text-zinc-500 text-sm">只展示真实有 AI 参与的作品 · 每件作品标注创作模型</p>
    </div>
    <div id="feed" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    <p id="empty" class="text-center text-zinc-400 py-16 hidden">没有找到相关作品</p>
  </main>

  <footer class="text-center text-zinc-400 text-xs py-8">© 2026 小集AI · 原型演示</footer>

  <!-- 上传弹窗 -->
  <div id="uploadModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50" onclick="if(event.target===this)hideUploadModal()">
    <div class="bg-white rounded-2xl w-[92%] max-w-md p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-2xl font-semibold mb-6">上传你的AI作品</h3>
        <button class="text-zinc-400 hover:text-zinc-600 text-xl" onclick="hideUploadModal()">×</button>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <button onclick="chooseType('image')" class="border rounded-xl py-8 flex flex-col items-center gap-2 hover:border-purple-500 hover:text-purple-600"><i class="fa-regular fa-image text-2xl"></i>图像</button>
        <button onclick="chooseType('video')" class="border rounded-xl py-8 flex flex-col items-center gap-2 hover:border-purple-500 hover:text-purple-600"><i class="fa-solid fa-video text-2xl"></i>视频</button>
        <button onclick="chooseType('music')" class="border rounded-xl py-8 flex flex-col items-center gap-2 hover:border-purple-500 hover:text-purple-600"><i class="fa-solid fa-music text-2xl"></i>音乐</button>
        <button onclick="chooseType('novel')" class="border rounded-xl py-8 flex flex-col items-center gap-2 hover:border-purple-500 hover:text-purple-600"><i class="fa-solid fa-book-open text-2xl"></i>小说</button>
      </div>
    </div>
  </div>

  <script>
    let currentCategory = 'all';
    let products = [
      { id: 1, title: '橘猫的早晨', creator: 'Mori', model: 'FLUX 1.1 Pro', likes: 1842, type: 'image', img: 'https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=600&auto=format&fit=crop&q=80' },
      { id: 2, title: '潮汐十二秒', creator: 'SOLA', model: 'Runway Gen-4', likes: 967, type: 'video', img: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&auto=format&fit=crop&q=80' },
      { id: 3, title: '雨后电台', creator: 'Nina L.', model: 'Suno v4.5', likes: 728, type: 'music', img: 'https://images.unsplash.com/photo-1511379938547-c1f69419868d?w=600&auto=format&fit=crop&q=80' },
      { id: 4, title: '未命名的雨夜', creator: 'Kite', model: 'Midjourney v7', likes: 1529, type: 'image', img: 'https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=600&auto=format&fit=crop&q=80' },
      { id: 5, title: '火星灯塔的冒险日记', creator: '纸上行舟', model: 'Claude Opus', likes: 645, type: 'novel', img: '' },
      { id: 6, title: '森林里的信号', creator: 'June', model: 'Imagen 4', likes: 1104, type: 'image', img: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&auto=format&fit=crop&q=80' },
      { id: 7, title: '漂浮的下午', creator: 'Orbit', model: 'Meshy 6', likes: 482, type: '3d', img: 'https://images.unsplash.com/photo-1499002238440-d264edd596ec?w=600&auto=format&fit=crop&q=80' },
      { id: 8, title: '写给终端的一封信', creator: 'v0id', model: 'GPT-5', likes: 316, type: 'code', img: '' },
      { id: 9, title: '雪地里的朋友', creator: 'ECHO', model: 'SDXL', likes: 892, type: 'image', img: 'https://images.unsplash.com/photo-1495360010541-f48722b34f7d?w=600&auto=format&fit=crop&q=80' },
      { id: 10, title: '玻璃窗边的早晨', creator: 'Hiro', model: 'Udio 1.5', likes: 551, type: 'music', img: 'https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=600&auto=format&fit=crop&q=80' },
      { id: 11, title: '城市的低语', creator: 'North', model: 'Kling 2.1', likes: 1278, type: 'video', img: 'https://images.unsplash.com/photo-1519608487953-e999c86e7450?w=600&auto=format&fit=crop&q=80' },
      { id: 12, title: '远方来信', creator: 'Aki', model: 'FLUX 1.1 Pro', likes: 739, type: 'image', img: 'https://images.unsplash.com/photo-1500534623283-312aade485b7?w=600&auto=format&fit=crop&q=80' }
    ];

    function renderFeed() {
      const feed = document.getElementById('feed');
      const list = products.filter(p => currentCategory === 'all' || p.type === currentCategory);
      const q = (document.getElementById('search')?.value || '').toLowerCase();
      const filtered = list.filter(p => !q || p.title.toLowerCase().includes(q) || p.creator.toLowerCase().includes(q) || p.model.toLowerCase().includes(q));
      document.getElementById('empty').classList.toggle('hidden', filtered.length > 0);
      feed.innerHTML = filtered.map(p => `
        <div class="work-card bg-white rounded-2xl overflow-hidden border border-zinc-100 cursor-pointer" onclick="showDetail(${p.id})">
          ${p.img ? `<img src="${p.img}" alt="${p.title}" class="w-full h-52 object-cover">` : `<div class="w-full h-52 bg-zinc-100 flex items-center justify-center text-zinc-300 text-4xl"><i class="fa-solid fa-${p.type === 'music' ? 'music' : p.type === 'novel' ? 'book' : 'terminal'}"></i></div>`}
          <div class="p-4">
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs text-purple-600 font-medium">${p.model}</span>
              <span class="text-xs text-zinc-400"><i class="fa-regular fa-heart"></i> ${p.likes}</span>
            </div>
            <h3 class="font-medium">${p.title}</h3>
            <p class="text-sm text-zinc-500">by ${p.creator}</p>
          </div>
        </div>`).join('');
    }
    function switchCategory(cat) { currentCategory = cat; document.querySelectorAll('.category-tab').forEach(el => el.classList.toggle('active', el.getAttribute('onclick')?.includes(`'${cat}'`))); renderFeed(); }
    function showDetail(id) {
      const p = products.find(x => x.id === id);
      alert(`作品详情：\n\n${p.title}\n\n作者：${p.creator}\n模型：${p.model}\n\n❤️ ${p.likes} 赞`);
    }
    function showUploadModal() { document.getElementById('uploadModal').classList.remove('hidden'); document.getElementById('uploadModal').classList.add('flex'); }
    function hideUploadModal() { document.getElementById('uploadModal').classList.add('hidden'); document.getElementById('uploadModal').classList.remove('flex'); }
    function chooseType(type) { hideUploadModal(); alert('原型提示：' + type + ' 上传将在后端阶段实现'); }
    function addTag(el) { el.classList.toggle('border-purple-500'); el.classList.toggle('text-purple-600'); }
    function filterGallery() { renderFeed(); }
    renderFeed();
  </script>
</body>
</html>
