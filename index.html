<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#faf8f3">
  <title>PixCollect - AI Works</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --paper: #faf8f3;
      --surface: #ffffff;
      --ink: #20201d;
      --muted: #74716a;
      --line: #e5e1d9;
      --soft: #f0ede7;
      --coral: #e45c4d;
      --coral-dark: #c9483c;
      --sun: #edbf4f;
      --sage: #4f796d;
      --shadow: 0 18px 34px -25px rgba(37, 31, 23, .38);
    }

    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--paper);
      font-family: "DM Sans", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
      outline: 3px solid rgba(228, 92, 77, .24);
      outline-offset: 2px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 72px;
      border-bottom: 1px solid rgba(32, 32, 29, .08);
      background: rgba(250, 248, 243, .93);
      backdrop-filter: blur(16px);
    }
    .topbar-inner {
      max-width: 1440px;
      height: 100%;
      margin: 0 auto;
      padding: 0 28px;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .brand-wrap { display: flex; align-items: center; gap: 28px; flex: 0 0 auto; }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      text-decoration: none;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      padding: 5px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px;
      border-radius: 8px;
      background: var(--ink);
    }
    .brand-mark span { border-radius: 2px; }
    .brand-name { font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
    .topbar-nav { display: flex; gap: 4px; margin-left: auto; }
    .topbar-nav a {
      padding: 8px 14px;
      border-radius: 999px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: background .15s, color .15s;
    }
    .topbar-nav a:hover { background: var(--soft); color: var(--ink); }
    .topbar-nav a.active { color: var(--ink); background: var(--soft); }
    .search-wrap { position: relative; flex: 1 1 320px; max-width: 420px; margin-left: auto; }
    .search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; }
    .search-wrap input {
      width: 100%;
      height: 42px;
      padding: 0 16px 0 40px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      font-size: 14px;
      transition: border-color .15s, box-shadow .15s;
    }
    .search-wrap input:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(32, 32, 29, .06); }
    .search-wrap.mobile { display: none; }
    .top-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }
    .icon-btn {
      width: 42px; height: 42px;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--line); border-radius: 999px;
      background: var(--surface); color: var(--ink);
      transition: background .15s, transform .15s;
    }
    .icon-btn:hover { background: var(--soft); transform: translateY(-1px); }
    .btn-primary {
      height: 42px; padding: 0 18px;
      display: inline-flex; align-items: center; gap: 8px;
      border: none; border-radius: 999px;
      background: var(--ink); color: #fff;
      font-size: 14px; font-weight: 600;
      transition: background .15s, transform .15s;
    }
    .btn-primary:hover { background: #000; transform: translateY(-1px); }
    .btn-primary svg { width: 16px; height: 16px; }
    .btn-ghost {
      height: 42px; padding: 0 18px;
      display: inline-flex; align-items: center; gap: 8px;
      border: 1px solid var(--line); border-radius: 999px;
      background: var(--surface); color: var(--ink);
      font-size: 14px; font-weight: 600;
      transition: background .15s;
    }
    .btn-ghost:hover { background: var(--soft); }

    .layout { max-width: 1440px; margin: 0 auto; padding: 28px; }
    .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 26px; flex-wrap: wrap; }
    .hero h1 { font-size: 34px; line-height: 1.15; margin: 0 0 8px; letter-spacing: -.02em; }
    .hero p { margin: 0; color: var(--muted); font-size: 15px; max-width: 560px; }
    .feed-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .categories { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .category {
      padding: 8px 16px; border: none; border-radius: 999px;
      background: transparent; color: var(--muted);
      font-size: 14px; font-weight: 500; white-space: nowrap;
      transition: background .15s, color .15s;
    }
    .category:hover { color: var(--ink); background: var(--soft); }
    .category.active { color: #fff; background: var(--ink); }
    .sort { height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font-size: 14px; }
    .sort:focus { outline: none; border-color: var(--ink); }
    .work-count { color: var(--muted); font-size: 13px; }

    .masonry {
      columns: 4 240px;
      column-gap: 20px;
    }
    .work-card {
      break-inside: avoid;
      margin-bottom: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .18s, box-shadow .18s;
      display: inline-block;
      width: 100%;
    }
    .work-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }
    .media { position: relative; }
    .media img, .media video { width: 100%; display: block; object-fit: cover; }
    .type-pill {
      position: absolute; top: 12px; left: 12px;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(32, 32, 29, .72); color: #fff;
      font-size: 12px; font-weight: 600;
      backdrop-filter: blur(8px);
    }
    .type-pill svg { width: 13px; height: 13px; }
    .type-pill.duration { left: auto; right: 12px; background: rgba(255, 255, 255, .9); color: var(--ink); }
    .copy { padding: 14px 16px 16px; }
    .work-title { font-size: 16px; margin: 0 0 10px; letter-spacing: -.01em; }
    .byline { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .author { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .mini-avatar {
      width: 24px; height: 24px; border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center;
      color: #fff; font-size: 11px; font-weight: 700; flex: 0 0 auto;
    }
    .author-name { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .likes { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); flex: 0 0 auto; }
    .likes svg { width: 14px; height: 14px; }

    .empty { text-align: center; padding: 80px 20px; color: var(--muted); }
    .empty svg { width: 40px; height: 40px; margin-bottom: 12px; opacity: .4; }

    dialog {
      border: none;
      border-radius: 22px;
      padding: 0;
      background: var(--surface);
      color: var(--ink);
      width: min(720px, calc(100vw - 32px));
      max-height: 88vh;
      box-shadow: 0 40px 80px -20px rgba(37, 31, 23, .4);
    }
    dialog::backdrop { background: rgba(32, 32, 29, .42); backdrop-filter: blur(4px); }
    .dialog-inner { padding: 0; }
    .dialog-close {
      position: absolute; top: 16px; right: 16px;
      width: 36px; height: 36px;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; border-radius: 999px;
      background: rgba(32, 32, 29, .55); color: #fff;
      backdrop-filter: blur(8px);
    }
    .dialog-close:hover { background: rgba(32, 32, 29, .75); }
    .dialog-media { position: relative; }
    .dialog-media img, .dialog-media video { width: 100%; max-height: 460px; object-fit: cover; display: block; border-radius: 22px 22px 0 0; }
    .dialog-body { padding: 24px 28px 28px; }
    .dialog-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .dialog-model {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 999px;
      background: var(--soft); font-size: 13px; font-weight: 600;
    }
    .dialog-model svg { width: 14px; height: 14px; }
    .dialog-date { font-size: 13px; color: var(--muted); }
    .dialog-title { font-size: 24px; margin: 0 0 6px; letter-spacing: -.02em; }
    .dialog-author { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; margin-bottom: 18px; }
    .dialog-desc { line-height: 1.75; color: var(--ink); font-size: 15px; }
    .dialog-desc p { margin: 0 0 12px; }
    .dialog-actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }

    #upload-dialog { width: min(560px, calc(100vw - 32px)); }
    .upload-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 24px; }
    .upload-option {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      padding: 22px 12px; border: 1px solid var(--line); border-radius: 16px;
      background: var(--surface); font-size: 14px; font-weight: 600; color: var(--ink);
      transition: border-color .15s, background .15s, transform .15s;
    }
    .upload-option:hover { border-color: var(--ink); background: var(--soft); transform: translateY(-2px); }
    .upload-option svg { width: 22px; height: 22px; }
    .upload-head { padding: 22px 24px 0; display: flex; align-items: center; justify-content: space-between; }
    .upload-head h2 { font-size: 18px; margin: 0; }
    .upload-sub { padding: 0 24px; margin-top: 6px; font-size: 13px; color: var(--muted); }

    .footer { max-width: 1440px; margin: 40px auto 0; padding: 24px 28px 40px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }

    @media (max-width: 720px) {
      .topbar-inner { padding: 0 16px; gap: 12px; }
      .topbar-nav { display: none; }
      .search-wrap { display: none; }
      .search-wrap.mobile { display: block; margin-left: 0; flex: 1 1 auto; }
      .top-actions { margin-left: 0; }
      .btn-primary span.hide-sm { display: none; }
      .layout { padding: 18px; }
      .hero h1 { font-size: 26px; }
      .masonry { columns: 2 150px; column-gap: 14px; }
      .work-card { margin-bottom: 14px; }
      .dialog-body { padding: 20px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-wrap">
        <a class="brand" href="./">
          <span class="brand-mark" aria-hidden="true"><span style="background:#e45c4d"></span><span style="background:#edbf4f"></span><span style="background:#4f796d"></span><span style="background:#20201d"></span></span>
          <span class="brand-name">PixCollect</span>
        </a>
        <nav class="topbar-nav" aria-label="主导航">
          <a href="#" class="active">发现</a>
          <a href="#">关注</a>
          <a href="#">收藏</a>
        </nav>
      </div>
      <div class="search-wrap">
        <i data-lucide="search" style="width:16px;height:16px;color:var(--muted)"></i>
        <input id="search-input" type="search" autocomplete="off" placeholder="搜索作品、模型、创作者" aria-label="搜索作品、模型、创作者">
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="random-button" type="button" title="随机看一个作品" aria-label="随机看一个作品"><i data-lucide="shuffle"></i></button>
        <button class="btn-primary" id="open-upload" type="button"><i data-lucide="plus"></i><span class="hide-sm">上传作品</span></button>
      </div>
    </div>
    <div class="topbar-inner" style="padding-top:0;padding-bottom:14px">
      <div class="search-wrap mobile">
        <i data-lucide="search" style="width:16px;height:16px;color:var(--muted)"></i>
        <input id="mobile-search-input" type="search" autocomplete="off" placeholder="搜索作品、模型、创作者" aria-label="搜索作品、模型、创作者">
      </div>
    </div>
  </header>

  <main class="layout">
    <div class="hero">
      <div>
        <h1>发现 AI 创作的现场</h1>
        <p>这里只展示真实有 AI 参与的作品。每件作品都标注使用的模型与创作者，欢迎投稿，也欢迎围观。</p>
      </div>
      <span class="work-count" id="work-count"></span>
    </div>

    <div class="feed-toolbar" aria-label="作品分区与排序">
      <div class="categories" role="tablist" aria-label="作品分区">
        <button class="category active" type="button" data-filter="all" role="tab" aria-selected="true">推荐</button>
        <button class="category" type="button" data-filter="image" role="tab" aria-selected="false">图像</button>
        <button class="category" type="button" data-filter="video" role="tab" aria-selected="false">视频</button>
        <button class="category" type="button" data-filter="music" role="tab" aria-selected="false">音乐</button>
        <button class="category" type="button" data-filter="novel" role="tab" aria-selected="false">小说</button>
        <button class="category" type="button" data-filter="3d" role="tab" aria-selected="false">3D</button>
        <button class="category" type="button" data-filter="code" role="tab" aria-selected="false">代码</button>
      </div>
      <select class="sort" id="sort-select" aria-label="作品排序">
        <option value="popular">最受欢迎</option>
        <option value="recent">最新发布</option>
      </select>
    </div>

    <section id="feed" class="masonry" aria-live="polite" aria-label="作品信息流"></section>
    <div class="empty" id="empty-state" hidden>
      <i data-lucide="search-x"></i>
      <p>没有找到匹配的作品，换个关键词试试。</p>
    </div>
  </main>

  <footer class="footer">
    <span>© 2026 PixCollect · 只收录有 AI 参与的作品</span>
    <span>原型预览 · 数据为示例</span>
  </footer>

  <dialog id="work-dialog" aria-labelledby="detail-title">
    <div class="dialog-inner" style="position:relative">
      <button class="dialog-close" id="dialog-close" type="button" aria-label="关闭"><i data-lucide="x"></i></button>
      <div class="dialog-media" id="detail-media"></div>
      <div class="dialog-body">
        <div class="dialog-meta">
          <span class="dialog-model" id="detail-model"></span>
          <span class="dialog-date" id="detail-date"></span>
        </div>
        <h2 class="dialog-title" id="detail-title"></h2>
        <div class="dialog-author" id="detail-author"></div>
        <div class="dialog-desc" id="detail-desc"></div>
        <div class="dialog-actions">
          <button class="btn-primary" type="button" id="detail-like"><i data-lucide="heart"></i>点赞</button>
          <button class="btn-ghost" type="button" id="detail-share"><i data-lucide="share-2"></i>分享</button>
        </div>
      </div>
    </div>
  </dialog>

  <dialog id="upload-dialog" aria-labelledby="upload-title">
    <div class="upload-head">
      <h2 id="upload-title">选择作品类型</h2>
      <button class="icon-btn" id="upload-close" type="button" aria-label="关闭"><i data-lucide="x"></i></button>
    </div>
    <p class="upload-sub">当前为原型演示：上传入口已就绪，真实上传功能将在后端阶段开放。</p>
    <div class="upload-grid">
      <button class="upload-option" type="button" data-kind="image"><i data-lucide="image"></i>图像</button>
      <button class="upload-option" type="button" data-kind="video"><i data-lucide="clapperboard"></i>视频</button>
      <button class="upload-option" type="button" data-kind="music"><i data-lucide="music-2"></i>音乐</button>
      <button class="upload-option" type="button" data-kind="novel"><i data-lucide="book-open"></i>小说</button>
      <button class="upload-option" type="button" data-kind="3d"><i data-lucide="box"></i>3D</button>
      <button class="upload-option" type="button" data-kind="code"><i data-lucide="code-2"></i>代码</button>
    </div>
  </dialog>

  <script>
    const works = [
      { id: 1, kind: 'image', title: '凌晨四点的橘猫', author: 'Mori', avatar: 'M', color: '#c77456', model: 'FLUX 1.1 Pro', likes: 1842, date: '今天', aspect: '4 / 5', src: 'https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=900&auto=format&fit=crop&q=85' },
      { id: 2, kind: 'video', title: '潮汐的十二秒', author: 'SOLA', avatar: 'S', color: '#4f7b6f', model: 'Runway Gen-4', likes: 967, date: '今天', aspect: '4 / 3', duration: '00:12', src: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=900&auto=format&fit=crop&q=85' },
      { id: 3, kind: 'music', title: '雨后电台', author: 'Nina L.', avatar: 'N', color: '#d39643', model: 'Suno v4.5', likes: 728, date: '今天', height: 262 },
      { id: 4, kind: 'image', title: '未命名的雨夜', author: 'Kite', avatar: 'K', color: '#616d92', model: 'Midjourney v7', likes: 1529, date: '昨天', aspect: '3 / 4', src: 'https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=900&auto=format&fit=crop&q=85' },
      { id: 5, kind: 'novel', title: '火星灯塔的冒险日记', author: '纸上行舟', avatar: '纸', color: '#8d6d4e', model: 'Claude Opus', likes: 645, date: '昨天', height: 248 },

      { id: 11, kind: 'video', title: '城市的低语', author: 'North', avatar: 'N', color: '#705f85', model: 'Kling 2.1', likes: 1278, date: '4 天前', aspect: '3 / 4', duration: '00:08', src: 'https://images.unsplash.com/photo-1519608487953-e999c86e7450?w=900&auto=format&fit=crop&q=85' },

    ];

    const labels = { image: '图像', video: '视频', music: '音乐', novel: '小说', '3d': '3D', code: '代码' };
    const iconNames = { image: 'image', video: 'clapperboard', music: 'music-2', novel: 'book-open', '3d': 'box', code: 'code-2' };
    let activeFilter = 'all';
    let activeSort = 'popular';
    let query = '';

    const feed = document.querySelector('#feed');
    const workDialog = document.querySelector('#work-dialog');
    const uploadDialog = document.querySelector('#upload-dialog');
    const countEl = document.querySelector('#work-count');
    const emptyEl = document.querySelector('#empty-state');

    function safe(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
    function niceLikes(value) { return value >= 1000 ? `${(value / 1000).toFixed(1)}k` : String(value); }
    function iconify() { if (window.lucide) window.lucide.createIcons({ attrs: { 'stroke-width': 1.8 } }); }
    function waveform() {
      const bars = [19,32,49,68,42,76,54,29,63,81,50,35,70,44,60,32,46,23];
      return `<div style="display:flex;align-items:flex-end;gap:3px;height:180px;padding:0 4px;background:linear-gradient(135deg,#2a2620,#17150f);"><svg viewBox="0 0 400 180" preserveAspectRatio="none" style="width:100%;height:100%"><rect x="0" y="0" width="400" height="180" fill="#17150f"/><g fill="#e45c4d">${bars.map((b,i)=>`<rect x="${i*21}" y="${90-b/2}" width="7" rx="3.5" height="${b}"/>`).join('')}</g></svg></div>`;
    }
    function mediaFor(work, detail = false) {
      const height = detail ? 430 : work.height;
      if (work.kind === 'music') {
        return `<div style="position:relative">${waveform()}${detail ? `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:600;letter-spacing:.1em">▶ ${safe(work.title)}</div>` : ''}</div>`;
      }
      if (work.kind === 'novel' || work.kind === 'code') {
        const text = work.kind === 'novel'
          ? '第一章 灯塔亮了<br><br>风从海面刮来，带着咸味和铁锈味。阿蓝把望远镜架在窗台上，第三次确认了那道光——它确实是亮的。<br><br>三年前，火星灯塔就再没有人点亮过。<br><br>“没有人会相信的。”她说，“但我们得记录下来。”'
          : 'import { render } from "./engine.js"<br><br>// 写给终端的一封信<br>const night = new Terminal({<br>&nbsp;&nbsp;theme: "dark",<br>&nbsp;&nbsp;cursor: "blink",<br>&nbsp;&nbsp;history: []<br>})<br><br>night.write("hello, world…")<br>night.flush()<br><br>while (!night.empty()) {<br>&nbsp;&nbsp;await night.think()<br>}';        return `<div style="position:relative;height:${height || 260}px;padding:20px;background:#17150f;color:#e8e2d6;font-size:13px;line-height:1.8;overflow:hidden">${detail ? text : text.split('<br>').slice(0,3).join('<br>') + '<br><span style="opacity:.4">…</span>'}</div>`;
      }
      return `<img src="${safe(work.src)}" alt="${safe(work.title)}" loading="lazy" style="aspect-ratio:${work.aspect || '4 / 3'};height:auto" ${detail ? `height="${height}"` : ''}>`;
    }
    function cardFor(work) {
      return `<article class="work-card" data-work="${work.id}" tabindex="0" role="button" aria-label="查看作品：${safe(work.title)}"><div class="media">${mediaFor(work)}<span class="type-pill"><i data-lucide="${iconNames[work.kind]}"></i>${labels[work.kind]}</span>${work.duration ? `<span class="type-pill duration">${work.duration}</span>` : ''}</div><div class="copy"><h2 class="work-title">${safe(work.title)}</h2><div class="byline"><span class="author"><span class="mini-avatar" style="background:${work.color}">${safe(work.avatar)}</span><span class="author-name">${safe(work.author)}</span></span><span class="likes"><i data-lucide="heart"></i>${niceLikes(work.likes)}</span></div></div></article>`;
    }
    function visibleWorks() {
      let list = works.filter(work => activeFilter === 'all' || work.kind === activeFilter);
      if (query) {
        const lowercase = query.toLowerCase();
        list = list.filter(work => [work.title, work.author, work.model].some(v => String(v).toLowerCase().includes(lowercase)));
      }
      if (activeSort === 'recent') list = [...list].sort((a, b) => works.indexOf(b) - works.indexOf(a));
      else list = [...list].sort((a, b) => b.likes - a.likes);
      return list;
    }
    function render() {
      const list = visibleWorks();
      feed.innerHTML = list.map(cardFor).join('');
      countEl.textContent = `${list.length} 件作品`;
      emptyEl.hidden = list.length > 0;
      iconify();
    }
    function openWork(id) {
      const work = works.find(w => w.id === id);
      if (!work) return;
      document.querySelector('#detail-media').innerHTML = mediaFor(work, true);
      document.querySelector('#detail-model').innerHTML = `<i data-lucide="sparkles"></i>${safe(work.model)}`;
      document.querySelector('#detail-date').textContent = work.date;
      document.querySelector('#detail-title').textContent = work.title;
      document.querySelector('#detail-author').innerHTML = `<span class="mini-avatar" style="background:${work.color}">${safe(work.avatar)}</span>${safe(work.author)} · <span style="color:var(--muted)">${niceLikes(work.likes)} 人喜欢</span>`;
      document.querySelector('#detail-desc').innerHTML = `<p>${safe(work.title)} 是一件使用 ${safe(work.model)} 生成的${labels[work.kind]}作品。当前为原型数据，真实描述将在内容录入后补充。</p>`;
      workDialog.showModal();
      iconify();
    }
    function closeDialog() { if (workDialog.open) workDialog.close(); }

    feed.addEventListener('click', e => {
      const card = e.target.closest('.work-card');
      if (card) openWork(Number(card.dataset.work));
    });
    feed.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        const card = e.target.closest('.work-card');
        if (card) { e.preventDefault(); openWork(Number(card.dataset.work)); }
      }
    });

    document.querySelector('#dialog-close').addEventListener('click', closeDialog);
    document.querySelector('#detail-like').addEventListener('click', function () { this.classList.toggle('liked'); });
    document.querySelector('#detail-share').addEventListener('click', () => { navigator.clipboard?.writeText(location.href).catch(() => {}); });
    workDialog.addEventListener('click', e => { if (e.target === workDialog) closeDialog(); });
    workDialog.addEventListener('cancel', closeDialog);

    document.querySelector('#open-upload').addEventListener('click', () => uploadDialog.showModal());
    document.querySelector('#upload-close').addEventListener('click', () => uploadDialog.close());
    document.querySelectorAll('.upload-option').forEach(btn => {
      btn.addEventListener('click', () => {
        uploadDialog.close();
        alert(`原型提示：${labels[btn.dataset.kind]} 上传流程将在后端阶段实现。`);
      });
    });
    uploadDialog.addEventListener('click', e => { if (e.target === uploadDialog) uploadDialog.close(); });

    document.querySelectorAll('.category').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.category').forEach(b => { b.classList.toggle('active', b === btn); b.setAttribute('aria-selected', b === btn ? 'true' : 'false'); });
        activeFilter = btn.dataset.filter;
        render();
      });
    });
    document.querySelector('#sort-select').addEventListener('change', e => { activeSort = e.target.value; render(); });
    const searchHandler = e => { query = e.target.value.trim(); render(); };
    document.querySelector('#search-input').addEventListener('input', searchHandler);
    document.querySelector('#mobile-search-input').addEventListener('input', searchHandler);
    document.querySelector('#random-button').addEventListener('click', () => {
      const list = visibleWorks();
      if (list.length) openWork(list[Math.floor(Math.random() * list.length)].id);
    });

    render();
  </script>
</body>
</html>
