<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#faf8f3">
  <title>PixCollect - AI Works</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --paper: #faf8f3;
      --surface: #ffffff;
      --ink: #20201d;
      --muted: #74716a;
      --line: #e5e1d9;
      --soft: #f0ede7;
      --coral: #e45c4d;
      --coral-dark: #c9483c;
      --sun: #edbf4f;
      --sage: #4f796d;
      --shadow: 0 18px 34px -25px rgba(37, 31, 23, .38);
    }

    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--paper);
      font-family: "DM Sans", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
      outline: 3px solid rgba(228, 92, 77, .24);
      outline-offset: 2px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 72px;
      border-bottom: 1px solid rgba(32, 32, 29, .08);
      background: rgba(250, 248, 243, .93);
      backdrop-filter: blur(16px);
    }
    .topbar-inner {
      max-width: 1440px;
      height: 100%;
      margin: 0 auto;
      padding: 0 28px;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .brand-wrap { display: flex; align-items: center; gap: 24px; flex: 0 0 auto; }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      text-decoration: none;
      cursor: pointer;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      padding: 5px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px;
      border-radius: 8px;
      background: var(--ink);
    }
    .brand-mark span { border-radius: 2px; }
    .brand-mark span:nth-child(1) { background: var(--coral); }
    .brand-mark span:nth-child(2) { background: var(--sun); }
    .brand-mark span:nth-child(3) { background: var(--sage); }
    .brand-mark span:nth-child(4) { background: var(--paper); }
    .brand-name { font-size: 18px; font-weight: 700; letter-spacing: -.055em; }
    
    .main-nav { display: flex; align-items: center; gap: 6px; }
    .nav-tab {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 8px;
      background: transparent;
      border: 0;
      transition: color .16s ease, background .16s ease;
    }
    .nav-tab:hover { color: var(--ink); background: var(--soft); }
    .nav-tab.active { color: var(--ink); font-weight: 600; background: var(--soft); }

    .search { position: relative; flex: 1 1 330px; max-width: 440px; margin-left: auto; }
    .search svg { position: absolute; top: 50%; left: 14px; width: 16px; height: 16px; color: #918d85; transform: translateY(-50%); pointer-events: none; }
    .search input {
      width: 100%;
      height: 40px;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0 15px 0 41px;
      color: var(--ink);
      background: #efede7;
      font-size: 14px;
      transition: background .16s ease, border-color .16s ease;
    }
    .search input::placeholder { color: #97938a; }
    .search input:focus { border-color: #cbc5bb; outline: none; background: var(--surface); }

    .actions { display: flex; align-items: center; gap: 9px; flex: 0 0 auto; }
    .icon-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: #4b4842;
      background: var(--surface);
      transition: background .16s ease, border-color .16s ease, color .16s ease;
    }
    .icon-btn:hover { border-color: #c7c0b5; color: var(--ink); background: #fffdfa; }
    .icon-btn svg { width: 17px; height: 17px; }
    .publish-btn {
      min-width: 80px;
      height: 38px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: var(--coral);
      box-shadow: 0 9px 18px -13px rgba(201, 72, 60, .85);
      font-size: 14px;
      font-weight: 600;
      transition: background .16s ease, transform .16s ease;
    }
    .publish-btn:hover { background: var(--coral-dark); transform: translateY(-1px); }
    .publish-btn svg { width: 16px; height: 16px; }
    .avatar { width: 34px; height: 34px; border: 2px solid var(--surface); border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 1px var(--line); }
    .mobile-search { display: none; }

    main { max-width: 1440px; margin: 0 auto; padding: 38px 28px 72px; }
    .page-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
    .eyebrow { margin: 0 0 8px; color: var(--coral-dark); font-size: 10px; font-weight: 700; letter-spacing: .15em; }
    h1 { margin: 0; font-size: 30px; line-height: 1.1; letter-spacing: -.055em; }
    .work-count { color: var(--muted); font-size: 13px; }

    .feed-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 26px;
      padding: 8px 0 16px;
      border-bottom: 1px solid var(--line);
    }
    .categories { display: flex; min-width: 0; gap: 7px; overflow-x: auto; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .category {
      flex: 0 0 auto;
      border: 0;
      border-radius: 999px;
      padding: 7px 12px;
      color: #5b5852;
      background: transparent;
      font-size: 13px;
      font-weight: 500;
      transition: color .16s ease, background .16s ease;
    }
    .category:hover { color: var(--ink); background: var(--soft); }
    .category.active { color: #fff; background: var(--ink); }
    .sort { flex: 0 0 auto; border: 0; border-radius: 7px; padding: 7px 26px 7px 8px; color: #5b5852; background: transparent; font-size: 13px; }

    .masonry { column-count: 2; column-gap: 14px; }
    .work-card {
      display: inline-block;
      width: 100%;
      margin: 0 0 25px;
      vertical-align: top;
      break-inside: avoid;
      cursor: pointer;
    }
    .work-card:focus { outline: none; }
    .media {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      background: #e9e5dd;
      box-shadow: 0 0 0 1px rgba(32, 32, 29, .04);
      transition: box-shadow .2s ease, transform .2s ease;
    }
    .work-card:hover .media { box-shadow: var(--shadow); transform: translateY(-2px); }
    .media > img { display: block; width: 100%; height: auto; object-fit: cover; transition: transform .38s ease; }
    .work-card:hover .media > img { transform: scale(1.025); }
    .type-pill {
      position: absolute;
      top: 9px;
      left: 9px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 7px;
      border-radius: 999px;
      color: #46423c;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 2px 8px rgba(35, 31, 24, .07);
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      backdrop-filter: blur(7px);
    }
    .type-pill svg { width: 11px; height: 11px; }
    .duration { left: auto; right: 9px; }
    .play-overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(25, 23, 20, .08); }
    .play-circle { width: 46px; height: 46px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.7); border-radius: 50%; color: var(--ink); background: rgba(255,255,255,.93); box-shadow: 0 10px 24px -14px rgba(0,0,0,.55); }
    .play-circle svg { width: 18px; height: 18px; margin-left: 2px; }

    .music-cover, .story-cover, .code-cover { min-height: 238px; padding: 21px; display: flex; flex-direction: column; justify-content: space-between; }
    .music-cover { background: #fff0e7; }
    .story-cover { background: #f1eee4; }
    .code-cover { color: #d8e9e3; background: #202525; }
    .cover-kicker { margin: 0; color: #936a60; font-size: 10px; font-weight: 700; letter-spacing: .13em; }
    .music-icon { width: 45px; height: 45px; display: grid; place-items: center; border-radius: 8px; color: var(--coral-dark); background: #fffaf6; box-shadow: 0 9px 17px -14px rgba(128,60,40,.65); }
    .music-icon svg { width: 22px; height: 22px; }
    .wave { height: 36px; display: flex; align-items: end; gap: 3px; }
    .wave span { width: 4px; border-radius: 999px; background: var(--coral); }
    .story-title { max-width: 210px; font-size: 22px; font-weight: 700; line-height: 1.22; letter-spacing: -.05em; }
    .story-copy { margin: 8px 0 0; color: #777065; font-size: 12px; line-height: 1.65; }
    .code-dots { display: flex; gap: 6px; }
    .code-dots span { width: 8px; height: 8px; border-radius: 50%; }
    .code-dots span:nth-child(1) { background: #eb7566; }
    .code-dots span:nth-child(2) { background: #edbf4f; }
    .code-dots span:nth-child(3) { background: #69b882; }
    .code-cover pre { margin: 0; font: 12px/1.75 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; }
    .code-key { color: var(--sun); }
    .code-value { color: #e89a89; }
    .code-cover .cover-kicker { color: #92b5a8; }

    .copy { padding: 10px 2px 0; }
    .work-title { margin: 0 0 7px; font-size: 14px; font-weight: 600; line-height: 1.45; letter-spacing: -.018em; }
    .byline { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; }
    .author { min-width: 0; display: inline-flex; align-items: center; gap: 6px; }
    .mini-avatar { width: 20px; height: 20px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 50%; color: #fff; font-size: 9px; font-weight: 700; }
    .author-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .likes { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .likes svg { width: 13px; height: 13px; color: var(--coral); fill: rgba(228, 92, 77, .12); }
    .empty { column-span: all; padding: 76px 20px; color: var(--muted); text-align: center; }
    .empty svg { display: block; width: 34px; height: 34px; margin: 0 auto 10px; color: #b8b2a8; }

    .review-btn {
      display: none;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--surface);
      font-size: 13px;
      font-weight: 600;
      transition: border-color .16s ease, background .16s ease;
    }
    .review-btn:hover { border-color: #bcb5aa; background: #fffdfa; }
    .review-btn svg { width: 14px; height: 14px; color: var(--coral); }
    .review-badge { min-width: 18px; height: 18px; padding: 0 5px; display: inline-grid; place-items: center; border-radius: 999px; color: #fff; background: var(--coral); font-size: 11px; line-height: 1; }
    .review-item { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .review-item:last-child { border-bottom: 0; }
    .review-thumb { width: 88px; height: 88px; flex: 0 0 auto; object-fit: cover; border-radius: 8px; background: #e9e5dd; }
    .review-info { min-width: 0; flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
    .review-input { width: 100%; height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: var(--surface); font-size: 13px; }
    .review-input:focus { border-color: #cbc5bb; outline: none; }
    .review-actions { display: flex; gap: 8px; }
    .review-actions .detail-action { flex: 1; min-height: 34px; }
    .review-actions .approve { border-color: var(--sage); color: #fff; background: var(--sage); }
    .review-actions .approve:hover { opacity: .9; }
    .review-actions .reject { color: var(--muted); }
    .empty-text { margin: 20px 0; color: var(--muted); text-align: center; font-size: 14px; }
    .upload-video { display: block; width: 100%; border-radius: 8px; }

    dialog { width: min(920px, calc(100% - 32px)); max-height: min(780px, calc(100% - 32px)); padding: 0; border: 0; border-radius: 8px; color: var(--ink); background: var(--surface); box-shadow: 0 30px 80px rgba(33,28,21,.3); }
    dialog::backdrop { background: rgba(30, 28, 24, .46); backdrop-filter: blur(3px); }
    .detail-layout { min-height: 520px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, .85fr); }
    .detail-media { display: grid; place-items: center; overflow: hidden; background: #e9e5dd; }
    .detail-media img { display: block; width: 100%; max-height: 730px; object-fit: contain; }
    .detail-panel { position: relative; display: flex; flex-direction: column; padding: 30px; overflow-y: auto; max-height: min(780px, calc(100vh - 64px)); }
    .close { position: absolute; top: 15px; right: 15px; }
    .detail-kind { margin: 0 0 12px; color: var(--coral-dark); font-size: 10px; font-weight: 700; letter-spacing: .14em; }
    .detail-title { max-width: 250px; margin: 0 0 12px; font-size: 24px; line-height: 1.2; letter-spacing: -.055em; }
    .detail-author { display: flex; align-items: center; gap: 9px; margin-bottom: 18px; color: var(--muted); font-size: 13px; }
    
    /* Prompt 展示区与复制按钮 */
    .prompt-box {
      margin-bottom: 20px;
      padding: 14px;
      border-radius: 8px;
      background: var(--soft);
      border: 1px solid var(--line);
    }
    .prompt-box-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: .08em;
    }
    .prompt-copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      transition: all .16s ease;
    }
    .prompt-copy-btn:hover { background: #fff; border-color: var(--coral); color: var(--coral-dark); }
    .prompt-copy-btn svg { width: 12px; height: 12px; }
    .prompt-content {
      margin: 0;
      font-size: 12.5px;
      line-height: 1.6;
      color: #3b3935;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .detail-info { margin: 0 0 20px; border-top: 1px solid var(--line); }
    .detail-info div { display: flex; justify-content: space-between; gap: 20px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .detail-info dt { color: var(--muted); }
    .detail-info dd { margin: 0; text-align: right; font-weight: 600; }
    .detail-actions { display: flex; gap: 9px; margin-top: auto; padding-top: 16px; }
    .detail-action { min-height: 38px; flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: var(--surface); font-size: 13px; font-weight: 600; }
    .detail-action:hover { border-color: #bcb5aa; background: #fffdfa; }
    .detail-action.primary { border-color: var(--coral); color: #fff; background: var(--coral); }
    .detail-action.primary:hover { background: var(--coral-dark); }
    .detail-action svg { width: 15px; height: 15px; }

    /* 上传表单弹窗 */
    .upload-dialog { width: min(540px, calc(100% - 32px)); max-height: min(85vh, 700px); }
    .upload-content { padding: 28px; overflow-y: auto; max-height: calc(85vh - 20px); }
    .upload-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .upload-heading h2 { margin: 0; font-size: 20px; letter-spacing: -.045em; }
    .upload-area {
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 2px dashed var(--line);
      border-radius: 8px;
      background: var(--soft);
      cursor: pointer;
      text-align: center;
      transition: border-color .16s ease, background .16s ease;
    }
    .upload-area:hover { border-color: var(--coral); background: #fff8f5; }
    .upload-icon { width: 28px; height: 28px; color: var(--coral); }
    .upload-text { margin: 0; font-size: 14px; font-weight: 600; }
    .upload-subtext { margin: 0; color: var(--muted); font-size: 12px; }
    
    .upload-form-group { margin-top: 14px; }
    .upload-form-group label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--ink); }
    .upload-form-group input, .upload-form-group select, .upload-form-group textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 13.5px;
      background: var(--surface);
      color: var(--ink);
    }
    .upload-form-group textarea { resize: vertical; min-height: 72px; }
    .upload-form-group input:focus, .upload-form-group select:focus, .upload-form-group textarea:focus {
      border-color: var(--coral);
      outline: none;
    }
    .upload-preview-box {
      margin-top: 14px;
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      max-height: 160px;
      background: #e9e5dd;
      display: none;
    }
    .upload-preview-box img, .upload-preview-box video { width: 100%; max-height: 160px; object-fit: contain; }

    .auth-dialog { width: min(420px, calc(100% - 32px)); max-height: none; }
    .auth-body { padding: 28px; }
    .auth-body h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.04em; }
    .auth-body p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
    .auth-body label { display: block; margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
    .auth-body input { width: 100%; height: 42px; margin-bottom: 14px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: var(--surface); font-size: 14px; }
    .auth-body input:focus { outline: 3px solid rgba(228, 92, 77, .2); border-color: var(--coral); }
    .auth-msg { min-height: 18px; margin: 0 0 12px; font-size: 13px; color: var(--sage); }
    .auth-msg.error { color: var(--coral); }
    .auth-actions { display: flex; gap: 10px; }
    .auth-actions button { flex: 1; height: 42px; border: 0; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .auth-btn { height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: var(--surface); font-size: 13px; font-weight: 600; }
    .auth-btn:hover { border-color: var(--ink); }

    /* 复制轻提示 Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: transform .25s cubic-bezier(.16, 1, .3, 1), opacity .25s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast svg { width: 14px; height: 14px; color: #4ade80; }

    @media (min-width: 1000px) { .masonry { column-count: 3; column-gap: 18px; } .work-card { margin-bottom: 28px; } }
    @media (min-width: 1280px) { .masonry { column-count: 4; } }
    @media (max-width: 820px) {
      .topbar { height: 64px; }
      .topbar-inner { padding: 0 16px; gap: 12px; }
      .brand-wrap { gap: 0; }
      .brand-mark { width: 31px; height: 31px; }
      .brand-name { font-size: 17px; }
      .main-nav, .desktop-search, .avatar, .actions > .icon-btn { display: none; }
      .actions { margin-left: auto; }
      .publish-btn { width: 38px; min-width: 38px; padding: 0; }
      .publish-btn span { display: none; }
      .mobile-search { display: block; padding: 10px 16px 0; background: rgba(250,248,243,.93); }
      main { padding: 28px 16px 52px; }
      h1 { font-size: 26px; }
      .work-count { display: none; }
      .feed-toolbar { margin-bottom: 20px; padding-bottom: 13px; }
      .sort { display: none; }
      .masonry { column-gap: 10px; }
      .work-card { margin-bottom: 21px; }
      .music-cover, .story-cover, .code-cover { min-height: 190px; padding: 16px; }
      .story-title { font-size: 18px; }
      .story-copy { font-size: 11px; }
      .detail-layout { display: block; }
      .detail-media { min-height: 250px; max-height: 50vh; }
      .detail-panel { min-height: 390px; padding: 24px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-wrap">

  <script>
  // ===== Supabase 免费额度配置 =====
  // 未配置时（保持默认值）页面自动回退纯本地 localStorage 模式，照常可用。
  // 配置方法见项目内 SETUP.md：注册 supabase.com → 建项目 → 建表 → 把 URL 和 anon key 填到这里。
  const SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co';  // ← 填入你的 Supabase 项目 URL
  const SUPABASE_ANON_KEY = 'YOUR-ANON-PUBLIC-KEY';          // ← 填入你的 anon public key（设置 → API）
  // ==============================================================

  let supabaseClient = null;
  let cloudUser = null;      // { id, email }
  let cloudSaveTimer = null;

  function cloudEnabled() {
    return SUPABASE_URL.startsWith('https://') &&
      SUPABASE_ANON_KEY.length > 30 &&
      !SUPABASE_ANON_KEY.includes('YOUR-');
  }

  function setAuthUi() {
    const btn = document.querySelector('#auth-toggle');
    if (!btn) return;
    btn.textContent = cloudUser ? (cloudUser.email || '我').split('@')[0] : '登录';
    const logoutBtn = document.querySelector('#auth-logout');
    const loginBtn = document.querySelector('#auth-login');
    const registerBtn = document.querySelector('#auth-register');
    const title = document.querySelector('#auth-title');
    if (cloudUser) {
      if (logoutBtn) logoutBtn.style.display = 'inline-block';
      if (loginBtn) loginBtn.style.display = 'none';
      if (registerBtn) registerBtn.style.display = 'none';
      if (title) title.textContent = '已登录';
    } else {
      if (logoutBtn) logoutBtn.style.display = 'none';
      if (loginBtn) loginBtn.style.display = 'inline-block';
      if (registerBtn) registerBtn.style.display = 'inline-block';
      if (title) title.textContent = '登录 PixCollect';
    }
  }

  function setAuthMsg(text, isError) {
    const msg = document.querySelector('#auth-msg');
    if (msg) { msg.textContent = text; msg.classList.toggle('error', !!isError); }
  }

  async function initCloud() {
    if (!cloudEnabled()) return;
    try {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (e) {
      console.warn('Supabase 初始化失败，保持本地模式', e);
      return;
    }
    try {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session && session.user) {
        cloudUser = session.user;
        await loadFromCloud();
      }
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session && session.user) {
          const changed = !cloudUser || cloudUser.id !== session.user.id;
          cloudUser = session.user;
          setAuthUi();
          if (changed) loadFromCloud();
        } else if (cloudUser) {
          cloudUser = null;
          setAuthUi();
          applyLocalState();
        }
      });
    } catch (e) {
      console.warn('Supabase 会话恢复失败，保持本地模式', e);
    }
  }

  // 从云端拉取用户数据（作品 / 待审核 / 点赞 / 收藏），覆盖本地
  async function loadFromCloud() {
    if (!supabaseClient || !cloudUser) return;
    const { data, error } = await supabaseClient
      .from('pix_state')
      .select('user_works, pending_works, liked, bookmarked')
      .eq('user_id', cloudUser.id)
      .maybeSingle();
    if (error) { console.warn('云端拉取失败', error.message); return; }
    if (data) {
      if (Array.isArray(data.user_works)) {
        allWorks = [...works].concat(data.user_works);
      }
      if (Array.isArray(data.pending_works)) pendingWorks = data.pending_works;
      if (data.liked) liked = data.liked;
      if (data.bookmarked) bookmarked = data.bookmarked;
      saveLocalState();
      render();
    }
  }

  // 把本地状态推到云端（防抖，登录后生效）
  function pushToCloud() {
    if (!supabaseClient || !cloudUser) return;
    clearTimeout(cloudSaveTimer);
    cloudSaveTimer = setTimeout(async () => {
      const payload = {
        user_id: cloudUser.id,
        user_works: allWorks.filter(w => w.user),
        pending_works: pendingWorks,
        liked,
        bookmarked,
        updated_at: new Date().toISOString()
      };
      const { error } = await supabaseClient.from('pix_state').upsert(payload, { onConflict: 'user_id' });
      if (error) console.warn('云端同步失败', error.message);
    }, 800);
  }

  async function uploadFileToCloud(file) {
    const path = `u-${Date.now()}-${Math.random().toString(36).slice(2)}/${file.name}`;
    const { error } = await supabaseClient.storage.from('pix-media').upload(path, file, { upsert: false });
    if (error) throw error;
    const { data: pub } = supabaseClient.storage.from('pix-media').getPublicUrl(path);
    return pub.publicUrl;
  }

  const works = [

    { id: 2, kind: 'video', title: '潮汐的十二秒', author: 'SOLA', avatar: 'S', color: '#4f7b6f', model: 'Runway Gen-4', prompt: 'Aerial cinematic drone footage over turquoise ocean waves gently crashing onto dark volcanic sand at golden sunset, ultra slow motion, 4k 60fps', likes: 967, date: '今天', aspect: '4 / 3', duration: '00:12', src: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=900&auto=format&fit=crop&q=85' },

    { id: 5, kind: 'novel', title: '火星灯塔的冒险日记', author: '纸上行舟', avatar: '纸', color: '#8d6d4e', model: 'Claude Opus', prompt: '写一部以火星殖民地边缘灯塔守望者为主角的科幻短篇，带有浪漫主义与孤独感。', likes: 645, date: '昨天', height: 248 },
    { id: 6, kind: 'image', title: '森林里的信号', author: 'June', avatar: 'J', color: '#5c8058', model: 'Imagen 4', prompt: 'Sunbeams penetrating dense misty ancient pine forest, glowing ethereal moss, magical realism, National Geographic nature photography, atmospheric fog', likes: 1104, date: '昨天', aspect: '4 / 5', src: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=900&auto=format&fit=crop&q=85' },
    { id: 7, kind: '3d', title: '漂浮的下午', author: 'Orbit', avatar: 'O', color: '#9e7360', model: 'Meshy 6', prompt: 'Surreal floating island with miniature modernist pavilion, clay render texture, soft ambient occlusion, stylized 3D game asset, isometric view', likes: 482, date: '2 天前', aspect: '4 / 3', src: 'https://images.unsplash.com/photo-1499002238440-d264edd596ec?w=900&auto=format&fit=crop&q=85' },
    { id: 8, kind: 'code', title: '写给终端的一封信', author: 'v0id', avatar: 'V', color: '#315f58', model: 'GPT-5', prompt: 'A generative canvas art script in WebGL that generates organic flow fields matching cursor velocity.', likes: 316, date: '2 天前', height: 220 },
    { id: 9, kind: 'image', title: '雪地里的朋友', author: 'ECHO', avatar: 'E', color: '#7c92a5', model: 'SDXL', prompt: 'A wild snow leopard sitting gracefully on a snowy mountain ridge in Himalayas, crisp winter lighting, detailed fur texture, 8k resolution', likes: 892, date: '3 天前', aspect: '4 / 3', src: 'https://images.unsplash.com/photo-1495360010541-f48722b34f7d?w=900&auto=format&fit=crop&q=85' },
    { id: 10, kind: 'music', title: '玻璃窗边的早晨', author: 'Hiro', avatar: 'H', color: '#bd6d5e', model: 'Udio 1.5', prompt: '[Indie Acoustic Folk] Fingerpicked warm wooden guitar, soft female whispering vocals, gentle morning sunlight mood, pristine recording', likes: 551, date: '3 天前', height: 232 },
    { id: 11, kind: 'video', title: '城市的低语', author: 'North', avatar: 'N', color: '#705f85', model: 'Kling 2.1', prompt: 'Tokyo night street time-lapse, bustling pedestrians, neon signs, fluid cinematic camera movement, anamorphic lens flare', likes: 1278, date: '4 天前', aspect: '3 / 4', duration: '00:08', src: 'https://images.unsplash.com/photo-1514565131-fce0801e5785?w=900&auto=format&fit=crop&q=85' },
    { id: 12, kind: 'image', title: '远方来信', author: 'Aki', avatar: 'A', color: '#a56e4c', model: 'FLUX 1.1 Pro', prompt: 'Open vintage leather envelope with dried flowers and stamp on weathered rustic wooden desk, warm cozy nostalgia, detailed macrolens', likes: 739, date: '4 天前', aspect: '4 / 5', src: 'https://images.unsplash.com/photo-1500534623283-312aade485b7?w=900&auto=format&fit=crop&q=85' }
  ];

  const labels = { image: '图像', video: '视频', music: '音乐', novel: '剧集', '3d': '3D', code: '代码' };
  const iconNames = { image: 'image', video: 'clapperboard', music: 'music-2', novel: 'book-open', '3d': 'box', code: 'code-2' };

  const STORAGE_KEY = 'pixcollect-v1';

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function saveLocalState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        pendingWorks,
        userWorks: allWorks.filter(w => w.user),
        liked,
        bookmarked
      }));
    } catch (e) { /* localStorage 满或不可用时静默忽略 */ }
  }
  function applyLocalState() {
    const saved = loadState();
    if (!saved) return;
    if (Array.isArray(saved.pendingWorks)) pendingWorks = saved.pendingWorks;
    if (saved.liked) liked = saved.liked;
    if (saved.bookmarked) bookmarked = saved.bookmarked;
    if (Array.isArray(saved.userWorks)) allWorks = [...works].concat(saved.userWorks);
    render();
  }
  function saveState() {
    saveLocalState();
    pushToCloud();
  }

  const saved = loadState();
  let allWorks = [...works];
  let pendingWorks = []; // 待审核
  let liked = {};        // 我赞过的作品 id
  let bookmarked = {};   // 我收藏的作品 id
  let currentOpenId = null;
  if (saved) {
    if (Array.isArray(saved.pendingWorks)) pendingWorks = saved.pendingWorks;
    if (saved.liked) liked = saved.liked;
    if (saved.bookmarked) bookmarked = saved.bookmarked;
    if (Array.isArray(saved.userWorks)) allWorks = allWorks.concat(saved.userWorks);
  }
  let activeView = 'discover'; // 'discover' | 'bookmarks' | 'my-works'
  let activeFilter = 'all';
  let activeSort = 'popular';
  let query = '';
  let currentUser = '我';
  let currentUploadFile = null;
  let currentUploadPreviewUrl = null;

  const feed = document.querySelector('#feed');
  const workDialog = document.querySelector('#work-dialog');
  const uploadDialog = document.querySelector('#upload-dialog');
  const reviewDialog = document.querySelector('#review-dialog');
  const fileInput = document.getElementById('file-input');
  const uploadArea = document.getElementById('upload-area');
  const reviewList = document.getElementById('review-list');
  const reviewToggle = document.getElementById('review-toggle');
  const pendingCount = document.getElementById('pending-count');

  function showToast(text) {
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toast-text');
    if (!toast || !toastText) return;
    toastText.textContent = text;
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function safe(value) {
    return String(value || '').replace(/[&<>'"]/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#039;', '"': '&quot;' }[c];
    });
  }
  function niceLikes(value) { return value >= 1000 ? `${(value / 1000).toFixed(1)}k` : String(value); }
  function iconify() { if (window.lucide) window.lucide.createIcons({ attrs: { 'stroke-width': 1.8 } }); }
  function waveform() {
    const bars = [19,32,49,68,42,76,54,29,63,81,50,35,70,44,60,32,46,23];
    return `<div class="wave" aria-hidden="true">${bars.map(height => `<span style="height:${height}%"></span>`).join('')}</div>`;
  }

  function mediaFor(work, detail = false) {
    const height = detail ? 430 : work.height;
    if (work.kind === 'video' && String(work.src).startsWith('data:video')) {
      return `<video class="upload-video" src="${safe(work.src)}" controls preload="metadata"></video>`;
    }
    if (work.kind === 'image' || work.kind === '3d') return `<img src="${safe(work.src)}" alt="${safe(work.title)}" style="aspect-ratio:${work.aspect}">`;
    if (work.kind === 'video') return `<img src="${safe(work.src)}" alt="${safe(work.title)}" style="aspect-ratio:${work.aspect}"><span class="play-overlay" aria-hidden="true"><span class="play-circle"><i data-lucide="play"></i></span></span>`;
    if (work.kind === 'music') return `<div class="music-cover" style="min-height:${height}px"><p class="cover-kicker">AI AUDIO · ${safe(work.model)}</p><span class="music-icon"><i data-lucide="music-2"></i></span>${waveform()}</div>`;
    if (work.kind === 'novel') return `<div class="story-cover" style="min-height:${height}px"><p class="cover-kicker">AI FICTION · ${safe(work.model)}</p><div><div class="story-title">${safe(work.title)}</div><p class="story-copy">第一章：清晨的第一缕光落在像素森林，一只围着红围巾的小猫走向远方。</p></div><p class="cover-kicker">VOL. 01</p></div>`;
    return `<div class="code-cover" style="min-height:${height}px"><div class="code-dots" aria-hidden="true"><span></span><span></span><span></span></div><pre><span class="code-key">function</span> makeArt(idea) {
  <span class="code-key">return</span> ai.create({
    mood: <span class="code-value">"quiet"</span>,
    idea
  });
}</pre><p class="cover-kicker">PIXCOLLECT / CODE</p></div>`;
  }

  function cardFor(work) {
    return `<article class="work-card" data-work="${work.id}" tabindex="0" role="button" aria-label="查看作品：${safe(work.title)}"><div class="media">${mediaFor(work)}<span class="type-pill"><i data-lucide="${iconNames[work.kind]}"></i>${labels[work.kind]}</span>${work.duration ? `<span class="type-pill duration">${work.duration}</span>` : ''}</div><div class="copy"><h2 class="work-title">${safe(work.title)}</h2><div class="byline"><span class="author"><span class="mini-avatar" style="background:${work.color}">${safe(work.avatar)}</span><span class="author-name">${safe(work.author)}</span></span><span class="likes" data-like="${work.id}" role="button" tabindex="0" title="点赞" aria-label="点赞"><i data-lucide="heart"${liked[work.id] ? ' style="fill:var(--coral);color:var(--coral)"' : ''}></i>${niceLikes(work.likes)}</span></div></div></article>`;
  }

  function visibleWorks() {
    let list = allWorks.filter(work => work.kind !== 'novel');

    // 视图过滤
    if (activeView === 'bookmarks') {
      list = list.filter(work => !!bookmarked[work.id]);
    } else if (activeView === 'my-works') {
      const userIdent = cloudUser ? (cloudUser.email || '我').split('@')[0] : currentUser;
      list = list.filter(work => work.user || work.author === userIdent || work.author === '我');
    }

    // 分类过滤
    if (activeFilter !== 'all') {
      list = list.filter(work => work.kind === activeFilter);
    }

    // 搜索过滤（支持标题、作者、模型、类型、Prompt 检索）
    if (query) {
      const lowercase = query.toLowerCase();
      list = list.filter(work => [work.title, work.author, work.model, work.prompt || '', labels[work.kind]].join(' ').toLowerCase().includes(lowercase));
    }
    return list.sort((a, b) => activeSort === 'popular' ? b.likes - a.likes : b.id - a.id);
  }

  function updateReviewBadge() {
    if (pendingWorks.length) {
      reviewToggle.style.display = 'inline-flex';
      pendingCount.textContent = pendingWorks.length;
    } else {
      reviewToggle.style.display = 'none';
    }
  }

  function render() {
    const list = visibleWorks();
    document.querySelector('#work-count').textContent = `${list.length} 件作品`;

    let emptyMessage = '没有找到相关作品';
    let emptyIcon = 'search-x';
    if (activeView === 'bookmarks') {
      emptyMessage = '你还没有收藏任何作品，去「发现」逛逛吧！';
      emptyIcon = 'bookmark';
    } else if (activeView === 'my-works') {
      emptyMessage = '你还没有发布过作品，点击右上角「发布」立即上传！';
      emptyIcon = 'folder-plus';
    }

    feed.innerHTML = list.length ? list.map(cardFor).join('') : `<div class="empty"><i data-lucide="${emptyIcon}"></i>${emptyMessage}</div>`;
    updateReviewBadge();
    iconify();
  }

  function openWork(id) {
    const work = allWorks.find(item => item.id === id);
    if (!work) return;
    currentOpenId = id;
    document.querySelector('#detail-media').innerHTML = mediaFor(work, true);
    document.querySelector('#detail-kind').textContent = labels[work.kind].toUpperCase();
    document.querySelector('#detail-title').textContent = work.title;
    document.querySelector('#detail-author').innerHTML = `<span class="mini-avatar" style="width:28px;height:28px;background:${work.color}">${safe(work.avatar)}</span><span>${safe(work.author)}</span>`;
    document.querySelector('#detail-model').textContent = work.model;
    document.querySelector('#detail-date').textContent = work.date;
    document.querySelector('#detail-likes').textContent = `${work.likes.toLocaleString()} 次`;

    // 填充 Prompt 区域
    const promptBox = document.querySelector('#detail-prompt-box');
    const promptContent = document.querySelector('#detail-prompt');
    if (work.prompt && work.prompt.trim()) {
      promptContent.textContent = work.prompt;
      promptBox.style.display = 'block';
    } else {
      promptContent.textContent = '暂未提供详细 Prompt 参数';
      promptBox.style.display = 'block';
    }

    const bookmarkBtn = document.querySelector('#detail-bookmark');
    if (bookmarkBtn) {
      bookmarkBtn.classList.toggle('primary', !!bookmarked[work.id]);
      bookmarkBtn.querySelector('span').textContent = bookmarked[work.id] ? '已收藏' : '收藏';
    }
    iconify();
    workDialog.showModal();
  }

  function openReview() {
    if (!pendingWorks.length) {
      reviewList.innerHTML = '<p class="empty-text">暂无待审核作品</p>';
    } else {
      reviewList.innerHTML = pendingWorks.map(w => `
        <div class="review-item" data-pending="${w.id}">
          ${w.kind === 'video' ? `<video src="${safe(w.src)}" muted class="review-thumb"></video>` : `<img src="${safe(w.src)}" alt="" class="review-thumb">`}
          <div class="review-info">
            <input class="review-input" value="${safe(w.title)}" placeholder="作品标题" aria-label="作品标题">
            <div style="font-size:12px; color:var(--muted);">模型：${safe(w.model || '未指定')}</div>
            <div class="review-actions">
              <button class="detail-action approve" type="button" data-review-approve><i data-lucide="check"></i>通过</button>
              <button class="detail-action reject" type="button" data-review-reject><i data-lucide="x"></i>拒绝</button>
            </div>
          </div>
        </div>`).join('');
    }
    iconify();
    reviewDialog.showModal();
  }

  // 重置发布表单
  function resetUploadForm() {
    currentUploadFile = null;
    currentUploadPreviewUrl = null;
    document.querySelector('#form-title').value = '';
    document.querySelector('#form-model').value = '';
    document.querySelector('#form-prompt').value = '';
    document.querySelector('#form-kind').value = 'image';
    document.querySelector('#upload-area-text').textContent = '点击或拖拽文件到这里上传';
    document.querySelector('#upload-preview-box').style.display = 'none';
    document.querySelector('#upload-preview-img').style.display = 'none';
    document.querySelector('#upload-preview-video').style.display = 'none';
    fileInput.value = '';
  }

  function handleFileSelected(file) {
    if (!file) return;
    currentUploadFile = file;
    const isVideo = file.type.startsWith('video/');
    document.querySelector('#form-kind').value = isVideo ? 'video' : 'image';
    if (!document.querySelector('#form-title').value.trim()) {
      document.querySelector('#form-title').value = file.name.replace(/\.[^.]+$/, '') || '未命名 AI 创作';
    }
    document.querySelector('#upload-area-text').textContent = `已选择: ${file.name}`;
    
    // 显示本地预览
    const reader = new FileReader();
    reader.onload = e => {
      currentUploadPreviewUrl = e.target.result;
      const previewBox = document.querySelector('#upload-preview-box');
      const previewImg = document.querySelector('#upload-preview-img');
      const previewVideo = document.querySelector('#upload-preview-video');
      previewBox.style.display = 'block';
      if (isVideo) {
        previewVideo.src = currentUploadPreviewUrl;
        previewVideo.style.display = 'block';
        previewImg.style.display = 'none';
      } else {
        previewImg.src = currentUploadPreviewUrl;
        previewImg.style.display = 'block';
        previewVideo.style.display = 'none';
      }
    };
    reader.readAsDataURL(file);
  }

  async function submitUploadForm() {
    const title = document.querySelector('#form-title').value.trim();
    const model = document.querySelector('#form-model').value.trim() || 'AI 模型生成';
    const kind = document.querySelector('#form-kind').value;
    const prompt = document.querySelector('#form-prompt').value.trim();

    if (!title) {
      alert('请填写作品标题');
      document.querySelector('#form-title').focus();
      return;
    }

    const cloudActive = cloudEnabled() && supabaseClient && cloudUser;
    let mediaSrc = currentUploadPreviewUrl;

    if (currentUploadFile) {
      try {
        if (cloudActive) {
          mediaSrc = await uploadFileToCloud(currentUploadFile);
        }
      } catch (err) {
        alert('文件上传到云端失败：' + (err.message || err));
        return;
      }
    } else if (kind === 'image' || kind === 'video' || kind === '3d') {
      mediaSrc = 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=900&auto=format&fit=crop&q=85';
    }

    const newWork = {
      id: Date.now() + Math.floor(Math.random() * 1000),
      kind: kind,
      title: title,
      author: cloudUser ? (cloudUser.email || '我').split('@')[0] : currentUser,
      avatar: '我',
      color: '#e45c4d',
      model: model,
      prompt: prompt,
      likes: 0,
      date: '今天',
      src: mediaSrc,
      aspect: kind === 'video' ? '16 / 9' : '4 / 5',
      user: true
    };

    pendingWorks.push(newWork);
    saveState();
    uploadDialog.close();
    resetUploadForm();
    render();
    showToast('作品已提交审核，可在「待审核」中确认');
  }

  // —— 导航与视图切换 ——
  document.querySelectorAll('[data-view]').forEach(tab => tab.addEventListener('click', () => {
    activeView = tab.dataset.view;
    document.querySelectorAll('[data-view]').forEach(t => t.classList.toggle('active', t === tab));
    
    const eyebrow = document.querySelector('#page-eyebrow');
    const title = document.querySelector('#page-title');
    if (activeView === 'discover') {
      eyebrow.textContent = 'DISCOVER';
      title.textContent = '正在发生';
    } else if (activeView === 'bookmarks') {
      eyebrow.textContent = 'COLLECTION';
      title.textContent = '我的收藏';
    } else if (activeView === 'my-works') {
      eyebrow.textContent = 'MY PORTFOLIO';
      title.textContent = '我的发布';
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
    render();
  }));

  document.querySelector('#brand-home').addEventListener('click', (e) => {
    e.preventDefault();
    document.querySelector('[data-view="discover"]').click();
  });

  // —— 事件绑定 ——
  document.querySelectorAll('[data-filter]').forEach(button => button.addEventListener('click', () => {
    activeFilter = button.dataset.filter;
    document.querySelectorAll('[data-filter]').forEach(item => {
      const current = item === button;
      item.classList.toggle('active', current);
      item.setAttribute('aria-selected', String(current));
    });
    render();
  }));

  document.querySelector('#sort-select').addEventListener('change', event => { activeSort = event.target.value; render(); });

  function connectSearch(input) {
    input.addEventListener('input', event => {
      query = event.target.value.trim();
      document.querySelectorAll('#search-input, #mobile-search-input').forEach(field => { if (field !== input) field.value = query; });
      render();
    });
  }
  connectSearch(document.querySelector('#search-input'));
  connectSearch(document.querySelector('#mobile-search-input'));

  feed.addEventListener('click', event => {
    const likeBtn = event.target.closest('[data-like]');
    if (likeBtn) {
      event.stopPropagation();
      const id = Number(likeBtn.dataset.like);
      if (!liked[id]) {
        liked[id] = true;
        const w = allWorks.find(x => x.id === id);
        if (w) w.likes += 1;
        saveState();
        render();
        showToast('已点赞');
      }
      return;
    }
    const card = event.target.closest('[data-work]');
    if (card) openWork(Number(card.dataset.work));
  });

  feed.addEventListener('keydown', event => {
    const likeBtn = event.target.closest('[data-like]');
    if (likeBtn && (event.key === 'Enter' || event.key === ' ')) {
      event.preventDefault(); event.stopPropagation();
      likeBtn.click();
      return;
    }
    if (event.key === 'Enter' || event.key === ' ') {
      const card = event.target.closest('[data-work]');
      if (card) { event.preventDefault(); openWork(Number(card.dataset.work)); }
    }
  });

  document.querySelector('[data-close-work]').addEventListener('click', () => workDialog.close());

  // 复制 Prompt 功能
  document.querySelector('#btn-copy-prompt').addEventListener('click', () => {
    const text = document.querySelector('#detail-prompt').textContent;
    if (!text || text === '暂未提供详细 Prompt 参数') return;
    navigator.clipboard.writeText(text).then(() => {
      showToast('Prompt 提示词已复制到剪贴板！');
    }).catch(() => {
      showToast('复制失败，请手动选取');
    });
  });

  // 上传弹窗
  document.querySelectorAll('[data-open-upload]').forEach(button => button.addEventListener('click', () => {
    resetUploadForm();
    uploadDialog.showModal();
  }));
  document.querySelectorAll('[data-close-upload]').forEach(btn => btn.addEventListener('click', () => uploadDialog.close()));
  document.querySelector('#btn-submit-upload').addEventListener('click', submitUploadForm);

  fileInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) {
      handleFileSelected(e.target.files[0]);
    }
  });

  // 拖拽上传
  uploadArea.addEventListener('click', () => fileInput.click());
  uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.style.borderColor = '#e45c4d'; });
  uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = ''; });
  uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.style.borderColor = '';
    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
      handleFileSelected(e.dataTransfer.files[0]);
    }
  });

  // 审核入口与操作
  reviewToggle.addEventListener('click', openReview);
  document.querySelector('[data-close-review]').addEventListener('click', () => reviewDialog.close());
  reviewList.addEventListener('click', (e) => {
    const item = e.target.closest('[data-pending]');
    if (!item) return;
    const id = Number(item.dataset.pending);
    const idx = pendingWorks.findIndex(w => w.id === id);
    if (idx === -1) return;
    if (e.target.closest('[data-review-approve]')) {
      const work = pendingWorks[idx];
      const input = item.querySelector('.review-input');
      if (input && input.value.trim()) work.title = input.value.trim();
      work.date = '今天';
      pendingWorks.splice(idx, 1);
      allWorks.unshift(work);
      saveState();
      render();
      openReview();
      showToast('审核通过，作品已发布到信息流');
    } else if (e.target.closest('[data-review-reject]')) {
      pendingWorks.splice(idx, 1);
      saveState();
      render();
      openReview();
      showToast('已拒绝该作品');
    }
  });

  document.querySelector('#detail-bookmark').addEventListener('click', () => {
    const work = allWorks.find(x => x.id === currentOpenId);
    if (!work) return;
    if (bookmarked[work.id]) {
      delete bookmarked[work.id];
      showToast('已取消收藏');
    } else {
      bookmarked[work.id] = true;
      showToast('已加入收藏');
    }
    saveState();
    const bookmarkBtn = document.querySelector('#detail-bookmark');
    bookmarkBtn.classList.toggle('primary', !!bookmarked[work.id]);
    bookmarkBtn.querySelector('span').textContent = bookmarked[work.id] ? '已收藏' : '收藏';
    if (activeView === 'bookmarks') render();
  });

  document.querySelector('#detail-remix').addEventListener('click', () => {
    const work = allWorks.find(x => x.id === currentOpenId);
    if (!work) return;
    workDialog.close();
    resetUploadForm();
    document.querySelector('#form-title').value = `Remix - ${work.title}`;
    document.querySelector('#form-model').value = work.model;
    document.querySelector('#form-kind').value = work.kind;
    document.querySelector('#form-prompt').value = work.prompt || '';
    uploadDialog.showModal();
  });

  document.querySelector('#random-button').addEventListener('click', () => openWork(allWorks[Math.floor(Math.random() * allWorks.length)].id));

  // —— 登录 / 注册 / 登出 ——
  async function doAuth(mode) {
    const email = document.querySelector('#auth-email').value.trim();
    const password = document.querySelector('#auth-password').value;
    if (!cloudEnabled()) { setAuthMsg('尚未配置 Supabase，无法登录（见 SETUP.md）', true); return; }
    if (!email || !password) { setAuthMsg('请输入邮箱和密码', true); return; }
    setAuthMsg('处理中…');
    const fn = mode === 'login' ? supabaseClient.auth.signInWithPassword : supabaseClient.auth.signUp;
    const { data, error } = await fn({ email, password });
    if (error) { setAuthMsg(error.message, true); return; }
    if (mode === 'login') {
      cloudUser = data.user;
      setAuthUi();
      setAuthMsg('');
      document.querySelector('#auth-dialog').close();
      await loadFromCloud();
      showToast('登录成功，云端数据已同步');
    } else {
      if (data.session) {
        cloudUser = data.user;
        setAuthUi();
        setAuthMsg('');
        document.querySelector('#auth-dialog').close();
        await loadFromCloud();
        showToast('注册成功，已自动登录');
      } else {
        setAuthMsg('注册成功！请到邮箱点击确认链接后再登录。');
      }
    }
  }

  document.querySelector('#auth-toggle').addEventListener('click', () => {
    setAuthUi();
    document.querySelector('#auth-dialog').showModal();
  });
  document.querySelector('#auth-login').addEventListener('click', () => doAuth('login'));
  document.querySelector('#auth-register').addEventListener('click', () => doAuth('register'));
  document.querySelector('#auth-logout').addEventListener('click', async () => {
    if (supabaseClient) await supabaseClient.auth.signOut();
    cloudUser = null;
    setAuthUi();
    setAuthMsg('');
    document.querySelector('#auth-dialog').close();
    applyLocalState();
    showToast('已退出登录');
  });

  iconify();
  render();
  initCloud();
  </script>
</body>
</html>
